<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>滑雪套餐每日调查</title>
<meta name="description" content="法国和安道尔一周全包滑雪套餐的每日价格调查">
<style>
  :root {
    --bg: #f4f7fa; --card: #ffffff; --ink: #14212b; --muted: #5b6b78;
    --line: #dde5ec; --accent: #0b6e99; --accent-soft: #e3f1f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f171d; --card: #17222b; --ink: #e6edf2; --muted: #93a4b1;
      --line: #263540; --accent: #5cc0e6; --accent-soft: #15303c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif;
  }
  header { border-bottom: 1px solid var(--line); background: var(--card); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 18px; }
  header .wrap { padding-top: 22px; padding-bottom: 18px; }
  h1.site { margin: 0; font-size: 1.35rem; letter-spacing: .01em; }
  .tagline { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .bar label { font-size: .85rem; color: var(--muted); }
  select, button {
    font: inherit; font-size: .9rem; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  }
  button { cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  a { color: var(--accent); }
  a.raw { font-size: .85rem; margin-left: auto; }
  main { padding: 22px 0 60px; }
  #report {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 6px 22px 24px; overflow-wrap: anywhere;
  }
  #report h1 { font-size: 1.4rem; margin: 22px 0 10px; }
  #report h2 {
    font-size: 1.15rem; margin: 34px 0 10px; padding-top: 22px;
    border-top: 1px solid var(--line);
  }
  #report h3 { font-size: 1rem; margin: 22px 0 6px; }
  #report ul, #report ol { padding-left: 1.3em; }
  #report li { margin: 3px 0; }
  #report blockquote {
    margin: 14px 0; padding: 10px 14px; background: var(--accent-soft);
    border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0;
  }
  #report blockquote p { margin: 0; }
  #report code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
  .table-scroll { overflow-x: auto; margin: 14px -4px; }
  #report table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  #report th, #report td {
    border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top;
  }
  #report th { background: var(--accent-soft); white-space: nowrap; }
  .empty { padding: 34px 0 14px; text-align: center; color: var(--muted); }
  footer { color: var(--muted); font-size: .8rem; text-align: center; padding: 0 18px 40px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1 class="site">滑雪套餐每日调查</h1>
    <p class="tagline">法国和安道尔 · 2027 年 1–3 月 · 一周全包（住宿、全食宿、雪票、雪具）· 1 人 800€ 以内</p>
    <div class="bar" id="bar" hidden>
      <label for="date">日期</label>
      <button id="older" type="button" aria-label="前一天">‹</button>
      <select id="date"></select>
      <button id="newer" type="button" aria-label="后一天">›</button>
      <a class="raw" id="raw" href="#">Markdown 原文</a>
    </div>
  </div>
</header>
<main class="wrap">
  <article id="report"><p class="empty">加载中…</p></article>
</main>
<footer>价格为调查当天所见，随时可能变动，预订前请到运营方网站核对。每天下午自动更新。</footer>

<script src="vendor/marked.umd.js"></script>
<script src="vendor/purify.min.js"></script>
<script>
(function () {
  var report = document.getElementById('report');
  var bar = document.getElementById('bar');
  var select = document.getElementById('date');
  var older = document.getElementById('older');
  var newer = document.getElementById('newer');
  var raw = document.getElementById('raw');
  var dates = [];

  function message(text) {
    report.innerHTML = '';
    var p = document.createElement('p');
    p.className = 'empty';
    p.textContent = text;
    report.appendChild(p);
  }

  function show(date) {
    if (dates.indexOf(date) === -1) return;
    select.value = date;
    var i = dates.indexOf(date);
    newer.disabled = i === 0;
    older.disabled = i === dates.length - 1;
    var url = 'reports/' + date + '.md';
    raw.href = url;
    if (location.hash !== '#' + date) history.replaceState(null, '', '#' + date);
    fetch(url, { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (md) {
        var html = DOMPurify.sanitize(marked.parse(md));
        report.innerHTML = html;
        report.querySelectorAll('table').forEach(function (t) {
          var box = document.createElement('div');
          box.className = 'table-scroll';
          t.parentNode.insertBefore(box, t);
          box.appendChild(t);
        });
        report.querySelectorAll('a[href]').forEach(function (a) {
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        });
        document.title = '滑雪套餐每日调查 · ' + date;
      })
      .catch(function () { message('这一天的报告读取失败。'); });
  }

  fetch('reports/index.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (list) {
      dates = (Array.isArray(list) ? list : [])
        .filter(function (d) { return /^\d{4}-\d{2}-\d{2}$/.test(d); })
        .sort().reverse();
      if (!dates.length) {
        message('还没有报告。第一份报告会在下一次每日调查完成后出现。');
        return;
      }
      dates.forEach(function (d) {
        var o = document.createElement('option');
        o.value = d; o.textContent = d;
        select.appendChild(o);
      });
      bar.hidden = false;
      var wanted = location.hash.slice(1);
      show(dates.indexOf(wanted) !== -1 ? wanted : dates[0]);
    })
    .catch(function () { message('报告列表读取失败。'); });

  select.addEventListener('change', function () { show(select.value); });
  older.addEventListener('click', function () {
    var i = dates.indexOf(select.value);
    if (i < dates.length - 1) show(dates[i + 1]);
  });
  newer.addEventListener('click', function () {
    var i = dates.indexOf(select.value);
    if (i > 0) show(dates[i - 1]);
  });
  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });
})();
</script>
</body>
</html>
